name: 02 - Timeform Analysis
on:
  workflow_dispatch:
  schedule:
    - cron: '15 9 * * *'
      timezone: 'Europe/London'
permissions:
  contents: write
concurrency:
  group: daily-timeform-analysis
  cancel-in-progress: true
jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/London
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --upgrade requests beautifulsoup4
      - name: Scrape Timeform
        run: python scripts/timeform_race_analysis.py
      - name: Publish Timeform data
        run: |
          DATE=$(TZ=Europe/London date +%F)
          mkdir -p timeform/archive
          cp scripts/timeform_races_${DATE}.csv timeform/latest_timeform_races.csv
          cp scripts/timeform_races_${DATE}.csv timeform/archive/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add timeform/
          git diff --cached --quiet || git commit -m "Update Timeform analysis $DATE"
          git pull --rebase origin main
          git push origin HEAD:main
