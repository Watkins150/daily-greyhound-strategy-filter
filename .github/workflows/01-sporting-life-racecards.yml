name: 01 - Sporting Life Racecards
on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'
      timezone: 'Europe/London'
permissions:
  contents: write
concurrency:
  group: daily-greyhound-racecards
  cancel-in-progress: true
jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/London
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --upgrade requests beautifulsoup4
      - name: Scrape Sporting Life
        run: python scripts/greyhound_racecards_downloader.py
      - name: Publish racecards
        run: |
          DATE=$(TZ=Europe/London date +%F)
          mkdir -p racecards/archive
          cp scripts/greyhound_racecards_${DATE}.csv racecards/latest_racecards.csv
          cp scripts/greyhound_racecard_audit_${DATE}.csv racecards/latest_audit.csv
          cp scripts/greyhound_racecards_${DATE}.csv racecards/archive/
          cp scripts/greyhound_racecard_audit_${DATE}.csv racecards/archive/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add racecards/
          git diff --cached --quiet || git commit -m "Update Sporting Life racecards $DATE"
          git pull --rebase origin main
          git push origin HEAD:main
